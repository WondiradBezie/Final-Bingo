name: joy-bingo
services:
  - name: app
    type: web
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    build_command: pip install --no-cache-dir -r requirements-free.txt
    run_command: uvicorn free_deploy:app --host 0.0.0.0 --port $PORT
